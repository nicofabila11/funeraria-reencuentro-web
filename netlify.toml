[build]
  functions = "netlify/functions"
  publish = "."

[build.environment]
  # La clave web de Firebase es publica por diseno; que el escaner de
  # secretos de Netlify no bloquee el deploy por encontrarla en el JS.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyCqkAZPwWijUA6Jo2IBxLW7PJn82Gz9k-c"
  SECRETS_SCAN_OMIT_VALUES = "AIzaSyCqkAZPwWijUA6Jo2IBxLW7PJn82Gz9k-c"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Atajos para el OAuth proxy (Decap/Sveltia CMS)
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/auth/callback"
  to = "/.netlify/functions/callback"
  status = 200
